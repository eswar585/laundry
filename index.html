<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laundry Tracker</title>
  
  <!-- Inline SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👕</text></svg>">

  <!-- Tailwind CSS Production CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- jsPDF & AutoTable plugin for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid font-bold fa-shirt text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">Laundry Tracker</h1>
      </div>
      <div id="connection-status-badge" class="text-xs bg-indigo-700/80 px-3 py-1.5 rounded-lg border border-indigo-500/50 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-amber-400" id="status-dot"></span>
        <span id="status-text">Connecting...</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-3xl mx-auto w-full px-4 py-6 flex-grow">
    
    <!-- Summary Header -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div>
        <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Total Clothes in Laundry</h2>
        <div id="total-count" class="text-4xl font-extrabold text-indigo-600 mt-1">0</div>
      </div>

      <!-- Main Action Buttons -->
      <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
        <button id="save-btn" onclick="saveAllToSupabase()" class="flex-1 sm:flex-none bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2.5 rounded-lg shadow-sm transition flex items-center justify-center gap-2 text-sm cursor-pointer">
          <i class="fa-solid fa-floppy-disk"></i> Save to DB
        </button>

        <button onclick="downloadPDF()" class="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2.5 rounded-lg shadow-sm transition flex items-center justify-center gap-2 text-sm cursor-pointer">
          <i class="fa-solid fa-file-pdf"></i> Download PDF
        </button>

        <button onclick="resetAllCounts()" class="flex-1 sm:flex-none bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 font-medium px-3 py-2.5 rounded-lg border border-slate-200 transition flex items-center justify-center gap-2 text-sm cursor-pointer">
          <i class="fa-solid fa-rotate-left"></i> Reset
        </button>
      </div>
    </div>

    <!-- Category List Card -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6">
      <div class="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <h3 class="font-semibold text-slate-700 text-sm">Categories & Counts</h3>
        <span id="sync-status" class="text-xs text-slate-400">Up to date</span>
      </div>

      <!-- Dynamic Item List -->
      <div id="category-list" class="divide-y divide-slate-100">
        <div class="p-8 text-center text-slate-400 text-sm">Loading categories...</div>
      </div>
    </div>

    <!-- Add New Category Form -->
    <form onsubmit="handleAddCategory(event)" class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex gap-2">
      <input 
        type="text" 
        id="new-category-input" 
        placeholder="Add custom category (e.g., Hoodies, Towels)..." 
        required 
        class="flex-1 px-4 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
      />
      <button 
        type="submit" 
        id="add-cat-btn"
        class="bg-slate-800 hover:bg-slate-900 text-white text-sm px-4 py-2 rounded-lg font-medium transition flex items-center gap-1.5 cursor-pointer"
      >
        <i class="fa-solid fa-plus text-xs"></i> Add Category
      </button>
    </form>
  </main>

  <!-- JavaScript Application Logic -->
  <script>
    // Configured Supabase Credentials
    const SUPABASE_URL = "https://vimnqjbupcffqzuvlpbi.supabase.co";
    const SUPABASE_KEY = "sb_publishable_LNTQ1QGQjkdDSbKIDNDTuQ_e0UJ59hK";

    let supabaseClient = null;
    let categories = [];

    document.addEventListener('DOMContentLoaded', () => {
      initSupabase();
      fetchCategories();
    });

    function initSupabase() {
      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');

      if (window.supabase && SUPABASE_URL && SUPABASE_KEY) {
        try {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          statusDot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
          statusText.innerText = "Connected to Supabase";
        } catch (err) {
          console.error("Failed to initialize Supabase client", err);
          supabaseClient = null;
          statusDot.className = "w-2 h-2 rounded-full bg-rose-400";
          statusText.innerText = "Connection Failed";
        }
      } else {
        supabaseClient = null;
        statusDot.className = "w-2 h-2 rounded-full bg-amber-400";
        statusText.innerText = "Local Mode";
      }
    }

    async function fetchCategories() {
      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('laundry_counts')
            .select('*')
            .order('category', { ascending: true });

          if (error) throw error;

          if (data && data.length > 0) {
            categories = data;
          } else {
            // Default initial items if table is empty
            categories = [
              { id: crypto.randomUUID(), category: 'Shirts', count: 0 },
              { id: crypto.randomUUID(), category: 'Pants', count: 0 },
              { id: crypto.randomUUID(), category: 'Socks', count: 0 },
              { id: crypto.randomUUID(), category: 'Undergarments', count: 0 },
              { id: crypto.randomUUID(), category: 'Bedding', count: 0 }
            ];
          }
        } catch (err) {
          console.error('Error fetching data from Supabase:', err.message);
        }
      }
      renderUI();
    }

    function renderUI() {
      const listContainer = document.getElementById('category-list');
      const totalDisplay = document.getElementById('total-count');

      if (!categories || categories.length === 0) {
        listContainer.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">No categories available. Add one below!</div>`;
        totalDisplay.innerText = '0';
        return;
      }

      let total = 0;
      listContainer.innerHTML = categories.map((item, index) => {
        const itemVal = parseInt(item.count) || 0;
        total += itemVal;

        return `
          <div class="p-4 flex items-center justify-between gap-4 hover:bg-slate-50/50 transition">
            <span class="font-medium text-slate-800 text-sm sm:text-base">${escapeHtml(item.category)}</span>
            
            <div class="flex items-center gap-2">
              <button 
                onclick="updateCount(${index}, -1)"
                class="w-9 h-9 flex items-center justify-center rounded-lg border border-slate-200 bg-white hover:bg-slate-100 text-slate-600 font-bold active:scale-95 transition shadow-xs cursor-pointer"
              >
                -
              </button>
              
              <input 
                type="number" 
                min="0"
                value="${itemVal}"
                onchange="setDirectCount(${index}, this.value)"
                class="w-16 h-9 text-center border border-slate-200 rounded-lg text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />

              <button 
                onclick="updateCount(${index}, 1)"
                class="w-9 h-9 flex items-center justify-center rounded-lg border border-slate-200 bg-white hover:bg-slate-100 text-slate-600 font-bold active:scale-95 transition shadow-xs cursor-pointer"
              >
                +
              </button>

              <button 
                onclick="deleteCategory(${index})"
                title="Delete Category"
                class="w-9 h-9 flex items-center justify-center text-slate-300 hover:text-rose-500 transition ml-2 cursor-pointer"
              >
                <i class="fa-solid fa-trash-can text-sm"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');

      totalDisplay.innerText = total.toString();
    }

    function updateCount(index, change) {
      const current = parseInt(categories[index].count) || 0;
      const updated = Math.max(0, current + change);
      categories[index].count = updated;
      markUnsaved();
      renderUI();
    }

    function setDirectCount(index, val) {
      const parsed = Math.max(0, parseInt(val) || 0);
      categories[index].count = parsed;
      markUnsaved();
      renderUI();
    }

    function markUnsaved() {
      const statusEl = document.getElementById('sync-status');
      statusEl.innerText = 'Unsaved changes';
      statusEl.className = 'text-xs text-amber-600 font-medium';
    }

    async function saveAllToSupabase() {
      const saveBtn = document.getElementById('save-btn');
      const originalText = saveBtn.innerHTML;

      saveBtn.disabled = true;
      saveBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Saving...`;

      if (supabaseClient) {
        try {
          const payload = categories.map(item => ({
            id: item.id || crypto.randomUUID(),
            category: item.category,
            count: parseInt(item.count) || 0,
            updated_at: new Date().toISOString()
          }));

          const { data, error } = await supabaseClient
            .from('laundry_counts')
            .upsert(payload, { onConflict: 'category' })
            .select();

          if (error) throw error;

          if (data) {
            categories = data;
          }

          document.getElementById('sync-status').innerText = 'Saved to database';
          document.getElementById('sync-status').className = 'text-xs text-emerald-600 font-medium';
        } catch (err) {
          console.error('Save failed:', err);
          alert('Supabase error: ' + err.message);
        }
      }

      saveBtn.disabled = false;
      saveBtn.innerHTML = originalText;
      renderUI();
    }

    async function handleAddCategory(e) {
      e.preventDefault();
      const input = document.getElementById('new-category-input');
      const catName = input.value.trim();

      if (!catName) return;

      const exists = categories.some(c => c.category.toLowerCase() === catName.toLowerCase());
      if (exists) {
        alert('Category already exists!');
        return;
      }

      // Add with a generated UUID so id is never null
      categories.push({
        id: crypto.randomUUID(),
        category: catName,
        count: 0
      });

      input.value = '';
      renderUI();

      if (supabaseClient) {
        await saveAllToSupabase();
      } else {
        markUnsaved();
      }
    }

    async function deleteCategory(index) {
      const target = categories[index];
      if (!confirm(`Are you sure you want to remove "${target.category}"?`)) return;

      if (supabaseClient && target.id) {
        try {
          const { error } = await supabaseClient
            .from('laundry_counts')
            .delete()
            .eq('id', target.id);

          if (error) throw error;
        } catch (err) {
          console.error('Delete failed:', err);
          alert('Could not delete from Supabase: ' + err.message);
          return;
        }
      }

      categories.splice(index, 1);
      renderUI();
    }

    function resetAllCounts() {
      if (!confirm('Reset all clothes counts to 0?')) return;
      categories.forEach(item => item.count = 0);
      markUnsaved();
      renderUI();
    }

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(20);
      doc.setTextColor(79, 70, 229);
      doc.text("Laundry Items Log Report", 14, 22);

      doc.setFontSize(10);
      doc.setTextColor(100);
      const today = new Date().toLocaleString();
      doc.text(`Generated on: ${today}`, 14, 30);

      const totalCount = categories.reduce((sum, item) => sum + (parseInt(item.count) || 0), 0);
      doc.setFillColor(243, 244, 246);
      doc.rect(14, 36, 182, 14, 'F');
      doc.setFontSize(11);
      doc.setTextColor(31, 41, 55);
      doc.text(`Total Clothes in Laundry: ${totalCount} items`, 20, 45);

      const tableData = categories.map((item, idx) => [
        idx + 1,
        item.category,
        item.count,
        item.updated_at ? new Date(item.updated_at).toLocaleDateString() : 'Today'
      ]);

      doc.autoTable({
        startY: 56,
        head: [['#', 'Category', 'Quantity', 'Last Update']],
        body: tableData,
        theme: 'striped',
        headStyles: { fillColor: [79, 70, 229] },
        styles: { fontSize: 10, cellPadding: 4 }
      });

      doc.save(`laundry_log_${new Date().toISOString().slice(0, 10)}.pdf`);
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[m]);
    }
  </script>
</body>
</html>
